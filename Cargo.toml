[package]
name = "rtop"
version = "0.1.0"
edition = "2024"
description = "A Rust TOP"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
humansize = "2.1.3"
ratatui = "0.30.2"
sysinfo = "0.40.1"
time = { version = "0.3.55", features = ["formatting"] }
whichdisk = "0.7.0"
