[package]
name = "rtop"
version = "0.1.0"
edition = "2024"
description = "A Rust TOP"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
detect-terminal = "0.1.2"
dirs = "7.0.0"
human-units = { version = "0.6.0", features = ["si-units"] }
humansize = "2.1.3"
os_info = "3.15.0"
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
regex = "1.13.2"
retch-sysinfo = "0.1.111"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
time = "0.3.55"
toml = "1.2.2"
whattheshell = "1.1.0"
whoami = "2.1.3"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7"
